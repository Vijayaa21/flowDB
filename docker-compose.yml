version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowdb
      SOURCE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowdb
      AUTH_SECRET: development-secret
      GITHUB_WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      - postgres
    ports:
      - '3000:3000'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXTAUTH_URL: http://localhost:3001
    depends_on:
      - orchestrator
    ports:
      - '3001:3001'

volumes:
  pgdata:
    driver: local
